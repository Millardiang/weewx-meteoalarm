###############################################################################
# Meteoalarm skin: weather warnings from www.meteoalarm.org                   #
#                                                                             #
# Areas and levels are set in the [Meteoalarm] section of weewx.conf; run    #
# bin/user/meteoalarm.py --setup to pick them on the area map. Anything set   #
# in a [Meteoalarm] section here overrides weewx.conf for this skin only.     #
###############################################################################

SKIN_NAME = Meteoalarm
SKIN_VERSION = 1.0.0

[Meteoalarm]

[Extras]
    # Link shown at the top of the pages, e.g. back to your main site.
    home_url = ../
    home_label = Weather station

[CheetahGenerator]
    search_list_extensions = user.meteoalarm.MeteoalarmSearchList
    encoding = utf8
    [[ToDate]]
        [[[details]]]
            # full warnings, one tab per language
            template = index.html.tmpl
        [[[summary]]]
            # small fragment to show on other pages (see meteoalarm-embed.js)
            template = summary.html.tmpl
        [[[banner]]]
            # banner for your home page; empty when there are no warnings
            template = banner.html.tmpl
        [[[json]]]
            # machine-readable copy of the current warnings
            template = meteoalarm.json.tmpl

[CopyGenerator]
    copy_once = meteoalarm.css, meteoalarm-embed.js, icons/*

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
